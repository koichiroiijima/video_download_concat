; video-concat 設定ファイル
; このファイルは video-concat.exe（Linux では video-concat）と同じフォルダに置いてください。
; 値が空の項目は既定値が使われます。
; コメントは行頭の「;」または「#」で書きます（行末コメントには対応していません）。

[http]
; 配信元が要求する Referer。http:// または https:// で指定します。
referer =
; User-Agent。空の場合はブラウザ相当の既定値を使います。
user_agent =

[download]
; 同時ダウンロード数（1 以上）
concurrency = 8
; 1 セグメントあたりの試行回数（1 以上）
retries = 3
; HTTP タイムアウト秒（0 より大きい）
timeout = 30

[playlist]
; マスタープレイリストの選択方法（best または 0 始まりの番号）
variant = best
; 相対 URI の基準 URL を上書きする場合に指定（http:// / https:// / file://）
base_url =
; 非標準の EXT-X-TOKEN をクエリパラメータとして付与する場合の名前
token_query =
; 非標準の EXT-X-TOKEN を HTTP ヘッダとして送信する場合の名前
token_header =

[output]
; 出力ファイル。空の場合は YYYYmmddHHMMSS.mp4
; 相対パスはこの設定ファイルのあるフォルダ基準です。
path =
; セグメントの保存先。空の場合は <出力名>_segments
work_dir =
; 取得したメディアプレイリストのコピー先
save_playlist =

[behavior]
; 結合後にセグメントを残す（true / false）
keep_segments = false
; 既存の出力とセグメントを上書きする（true / false）
force = false

[ffmpeg]
; ffmpeg の実行パス。空の場合は同じフォルダ → PATH の順に探します。
; 相対パスはこの設定ファイルのあるフォルダ基準です。
path =
; ffmpeg が見つからない場合に自動ダウンロードする（true / false）
auto_download = true
